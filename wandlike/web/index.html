<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WandLike</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div class="brand pywebview-drag-region"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>WandLike</div>
    <div class="drag pywebview-drag-region" id="drag"></div>
    <button id="upd-pill"></button>
    <button class="winbtn" data-win="minimize" title="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="winbtn" data-win="max" title="Maximize"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
    <button class="winbtn close" data-win="close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<button id="logbtn"></button>
<div id="logpane"></div>
<div id="toasts"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
