name: catalog-index
# Game definitions are pulled by installed apps straight from this repo. Whenever one changes on main,
# regenerate wandlike/games/_index.json (content hashes) so installed apps notice the update.
# No version bump and no app release is needed.
on:
  push:
    branches: [main]
    paths:
      - "wandlike/games/*.json"
      - "!wandlike/games/_index.json"
permissions:
  contents: write
jobs:
  index:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hexctl
        shell: pwsh
        run: |
          . ./tools/vsenv.ps1
          cmake -S . -B build/win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/win --target hexctl
      - name: Regenerate the index
        run: build/win/hexctl.exe catalog
      - name: Commit it if it changed
        shell: bash
        run: |
          if git diff --quiet -- wandlike/games/_index.json; then
            echo "index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wandlike/games/_index.json
          git commit -m "Regenerate game catalog index"
          git push
