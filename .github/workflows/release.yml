name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (version taken from the tag)
        shell: pwsh
        run: ./build.ps1 -Version "${{ github.ref_name }}".TrimStart("v")
      - name: Legacy asset name
        # Installed 1.x clients (the Python WandLike) look for WandLike-Setup.exe; keep them able to update across the rewrite.
        shell: pwsh
        run: Copy-Item dist/Hexwright-Setup.exe dist/WandLike-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Hexwright-Setup.exe
            dist/WandLike-Setup.exe
            dist/hexctl.exe
          generate_release_notes: true
